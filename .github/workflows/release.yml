name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.0.0). Vazio usa a tag ou o csproj."
        required: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Instalar Velopack
        run: dotnet tool install -g vpk

      - name: Testes
        run: dotnet test Lumenhop.sln --nologo

      - name: Empacotar
        shell: pwsh
        env:
          LUMENHOP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -and $env:GITHUB_REF_NAME -like "v*") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if ($version) {
            pwsh scripts/pack.ps1 -Version $version
          } else {
            pwsh scripts/pack.ps1
          }

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUMENHOP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          pwsh scripts/pack.ps1 -Version $version -SkipBuild -Upload
